name: Deploy K3s Cluster

on:
  workflow_dispatch:

  repository_dispatch:
    types: [infrastructure-changed]

  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'renovate.json'
      - 'group_vars/proxmox_hosts/**'
      - 'roles/ser2net/**'
      - 'ser2net.yml'

# Serialize deploys: never cancel an in-progress run (a deploy interrupted
# mid `helm upgrade` leaves the release in a pending-* state). Queue instead.
concurrency:
  group: deploy-k3s-cluster
  cancel-in-progress: false

jobs:
  provision:
    name: Apply Configuration
    runs-on: self-hosted
    container:
      # Match validate.yml; Ansible 2.21 fails to import under Python 3.15.
      image: python:3.14-trixie
      volumes:
        - /var/lib/homelab-maintenance:/maintenance
    env:
      HOMELAB_RUNNER_INSTANCE: cc1aeeb7-4827-466c-9d4b-5dc6c881f193
      K3S_DRAIN_RECOVERY_NODES: >-
        ${{ github.event_name == 'repository_dispatch' && github.event.action == 'infrastructure-changed'
        && toJSON(github.event.client_payload.drained_nodes || fromJSON('[]')) || '[]' }}
      MAINTENANCE_OWNER: ${{ github.repository }}/${{ github.run_id }}/${{ github.run_attempt }}
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout reviewed maintenance helper
        uses: actions/checkout@v7
        with:
          repository: Starktastic-Homelab/ansible
          ref: 887269798650e88fed791bb4f22a47bf50ad17be
          path: maintenance-helper
          persist-credentials: false

      - name: Cache Pip Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Ansible and requirements
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Setup Helm
        uses: azure/setup-helm@v5.0.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: 'v4.3.0'

      - name: Prepare private connection credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > private_key.pem
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass

      - name: Acquire external maintenance ownership
        run: python3 maintenance-helper/scripts/maintenance_lock.py acquire --operation ansible-deploy --github-env

      - name: Run K3s Playbook
        run: |
          python3 maintenance-helper/scripts/maintenance_lock.py verify
          ansible-playbook -i inventory/proxmox.yml \
            --vault-password-file .vault_pass \
            --private-key private_key.pem \
            k3s.yml

      - name: Release ownership after successful configuration
        run: python3 maintenance-helper/scripts/maintenance_lock.py release

      # Artifacts of this public repo are downloadable by anyone, so only ciphertext leaves the runner.
      # The vault password already guards the public group_vars/all/secrets.yml, so this adds no new target,
      # and the org-secret PAT stays off the self-hosted runner.
      - name: Encrypt kubeconfig for handoff
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -pass env:ANSIBLE_VAULT_PASSWORD \
            -in ~/.kube/config -out handoff.enc

      - name: Upload encrypted kubeconfig artifact
        uses: actions/upload-artifact@v7
        with:
          name: kubeconfig-handoff
          path: handoff.enc
          retention-days: 1

      - name: Remove private controller credentials
        if: always()
        run: rm -f .vault_pass private_key.pem ~/.kube/config handoff.enc

  handoff:
    name: Push kubeconfig to org secret
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Download encrypted kubeconfig artifact
        uses: actions/download-artifact@v8
        with:
          name: kubeconfig-handoff

      # Decrypt to a file first: a failed decrypt must stop before gh, never set a partial secret.
      - name: Update org-wide kubeconfig secret
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GH_PAT_ORG_SECRET_MANAGER }}
        run: |
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -pass env:ANSIBLE_VAULT_PASSWORD \
            -in handoff.enc -out kubeconfig
          # CBC has no MAC: a wrong key passes the padding check about 1 time in 256.
          grep -qx 'kind: Config' kubeconfig
          gh secret set KUBECONFIG_RAW --org Starktastic-Homelab --visibility selected --repos apps,terraform < kubeconfig
