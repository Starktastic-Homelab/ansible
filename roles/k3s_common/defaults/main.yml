---
# Resolver handed to kubelet via --resolv-conf, and therefore inherited by every
# ClusterFirst pod. Deliberately NOT the node's own /etc/resolv.conf, which adds
# "search mgmt.arpa" (from netplan, reinforced by radvd DNSSL) and an IPv6 ULA
# nameserver that pods cannot reach over the IPv4-only flannel network.
k3s_common_resolv_conf: /etc/k3s-resolv.conf

# AdGuard Home on OPNsense. Same address the nodes already resolve through, so
# this changes which suffixes pods try, not who ultimately answers them.
k3s_common_upstream_dns: "10.9.9.1"
