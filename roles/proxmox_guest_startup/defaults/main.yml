---
# kdump stays installed but off: on 2026-11-15 makedumpfile was OOM-killed at crashkernel=1G and the crash kernel
# never rebooted. Re-arm only in an attended window; the plain panic reboot covers crashes meanwhile.
proxmox_guest_startup_kdump_enabled: false
# Reserved for the crash kernel at the next boot; used only when kdump is enabled.
proxmox_guest_startup_crashkernel: "2G"
# KFENCE (2026-11-15): sampled slab use-after-free/out-of-bounds checks for the NFS-client oopses, ~2 MiB and near-zero
# CPU. A hit logs "BUG: KFENCE" and the host keeps running. Set live and on the command line; 0 turns it off.
proxmox_guest_startup_kfence_sample_interval: 100
# Debug tokens for the next boot's kernel command line; empty the list to drop them (kfence.* tokens always are).
proxmox_guest_startup_debug_cmdline:
  - "kfence.sample_interval={{ proxmox_guest_startup_kfence_sample_interval }}"
