---
# Takes effect at the next boot; nothing here reboots the host.
- name: Refresh boot tool
  ansible.builtin.command:
    argv: [proxmox-boot-tool, refresh]
  changed_when: true

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# Reloads only a crash kernel that is already loaded (no-op before the first crashkernel= boot); never when disabled.
- name: Reload kdump
  ansible.builtin.command:
    argv: [kdump-config, try-reload]
  changed_when: true
  when: proxmox_guest_startup_kdump_enabled | bool
