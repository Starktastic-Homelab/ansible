---
# Daily: delete removed volumes whose 3-day quarantine has passed (ADR 0017). Runs under an existing maintenance lock.
# Lab: ansible-playbook -i <lab>/inventory.yml -e @<lab>/vars.yml storage-expiry.yml
- name: Lab guard
  hosts: all
  gather_facts: false
  any_errors_fatal: true
  tags:
    - always
  tasks:
    - name: Refuse a lab run aimed at production
      ansible.builtin.import_tasks: tasks/lab-guard.yml
      run_once: true

- name: Verify maintenance ownership
  hosts: storage
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Verify maintenance ownership
      ansible.builtin.import_role:
        name: storage_vm
        tasks_from: lock-verify.yml

- name: Write a private kubeconfig
  hosts: masters[0]
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: Read and rewrite the control-plane kubeconfig
      ansible.builtin.import_role:
        name: storage_vm
        tasks_from: kubeconfig.yml

- name: List expiry candidates
  hosts: storage
  become: true
  gather_facts: false
  any_errors_fatal: true
  tasks:
    - name: List pending-delete volumes past quarantine
      ansible.builtin.command:
        argv: [/usr/local/sbin/storage-reconcile, expire-candidates, --config, /etc/homelab-storage/config.json]
      register: storage_vm_expiry_list
      changed_when: false

    - name: Record the candidates
      ansible.builtin.set_fact:
        storage_vm_expiry_candidates: "{{ storage_vm_expiry_list.stdout | from_json }}"

- name: Expire removed volumes
  hosts: localhost
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Refuse in-use volumes, then delete their claims, PVs and storage
      ansible.builtin.import_role:
        name: storage_vm
        tasks_from: expire.yml

- name: Remove the temporary files
  hosts: localhost
  gather_facts: false
  become: false
  any_errors_fatal: true
  tasks:
    - name: Remove the kubeconfig
      ansible.builtin.file:
        path: "{{ hostvars[groups['masters'][0]].storage_vm_kubeconfig_path }}"
        state: absent
