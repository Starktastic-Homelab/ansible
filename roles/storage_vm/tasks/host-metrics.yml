---
# Dataset and lock gauges for StorageDatasetLow and MaintenanceLockStale (ADR 0017): no exporter runs on pve or on the
# runner, so they are written on the storage VM, whose node-exporter is scraped. Only storage-host-metrics.yml runs
# this, without the lock: a read-only df on pve, a read of the lock record, one textfile.
- name: Read the k3s-block free space on pve
  ansible.builtin.command:
    argv: [df, -B1, "--output=target,fstype,avail", "{{ storage_vm_k3s_block_mount }}"]
  delegate_to: "{{ groups['proxmox_hosts'][0] }}"
  become: false
  register: storage_vm_df
  changed_when: false
  # Unmounted (pve booted while TrueNAS was down), df reports pve's root filesystem: fail, so the staleness leg fires.
  failed_when: >-
    storage_vm_df.rc != 0
    or (storage_vm_df.stdout_lines | last).split()[0] != storage_vm_k3s_block_mount
    or not (storage_vm_df.stdout_lines | last).split()[1].startswith('nfs')
  # A hard NFS mount blocks while TrueNAS is down; never hold the reconcile behind it.
  timeout: 60

# Only the holder's name and start leave the record; a missing record is a free lock (0).
- name: Read the maintenance lock holder and start time
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import datetime, json, sys
        try:
            with open(sys.argv[1]) as f:
                record = json.load(f)
        except FileNotFoundError:
            record = None
        print(json.dumps({'operation': record['operation'],
                          'created': datetime.datetime.fromisoformat(record['created_at']).timestamp()}
                         if record else {'operation': '', 'created': 0}))
      - "{{ storage_vm_maintenance_root }}/operation.json"
  delegate_to: localhost
  become: false
  register: storage_vm_lock
  changed_when: false

# metrics.write, as the reconcile's own textfiles: a temporary file and a rename, never half-read.
- name: Write storage-host.prom
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import sys, time
        sys.path.insert(0, '/usr/local/lib/homelab-storage')
        from homelab_storage import metrics
        dataset, avail, operation, created = sys.argv[1:]
        metrics.write('storage-host', [
            ('storage_dataset_avail_bytes', {'dataset': dataset}, int(avail)),
            ('storage_dataset_timestamp_seconds', {}, time.time()),
            ('storage_maintenance_lock_created_timestamp_seconds', {'operation': operation}, float(created))])
      - "{{ storage_vm_k3s_block_dataset }}"
      - "{{ (storage_vm_df.stdout_lines | last).split()[2] }}"
      - "{{ (storage_vm_lock.stdout | from_json).operation }}"
      - "{{ (storage_vm_lock.stdout | from_json).created }}"
  changed_when: true
