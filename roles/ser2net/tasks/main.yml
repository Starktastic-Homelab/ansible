---
- name: Install ser2net
  ansible.builtin.apt:
    name: ser2net
    state: present
    update_cache: true

- name: Deploy ser2net configuration
  ansible.builtin.template:
    src: ser2net.yaml.j2
    dest: /etc/ser2net.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart ser2net

- name: Enable and start ser2net
  ansible.builtin.systemd:
    name: ser2net
    enabled: true
    state: started
