---
- name: Join worker node to cluster
  tags:
    - k3s
    - workers
  block:
    - name: Join worker to cluster
      ansible.builtin.command:
        cmd: /tmp/k3s-install.sh
      environment:
        K3S_TOKEN: "{{ global_k3s_token }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        INSTALL_K3S_EXEC: >-
          agent --server https://{{ vip_address }}:6443 --flannel-iface {{ flannel_iface }} --node-ip {{ ansible_host }}
      when: not k3s_common_k3s_binary.stat.exists
      changed_when: true

    - name: Wait for K3s agent to be ready
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/agent/kubelet.kubeconfig
        state: present
        timeout: 120

  rescue:
    - name: K3s worker join failed
      ansible.builtin.fail:
        msg: "K3s worker join failed on {{ inventory_hostname }}. Check /var/log/syslog for details."

- name: Label worker node
  delegate_to: localhost
  become: false
  kubernetes.core.k8s:
    kind: Node
    name: "{{ inventory_hostname }}"
    definition:
      metadata:
        labels:
          node-role.kubernetes.io/worker: "true"
          intel.feature.node.kubernetes.io/gpu: "true"
  tags:
    - k3s
    - workers
    - labels

- name: Record verified worker generation after joining Kubernetes
  when: iscsi_initiator_ready | default(false) | bool
  block:
    - name: Read current Kubernetes worker UID
      delegate_to: localhost
      become: false
      kubernetes.core.k8s_info:
        kind: Node
        name: "{{ inventory_hostname }}"
      register: k3s_workers_iscsi_node

    - name: Require one exact current worker
      ansible.builtin.assert:
        that:
          - k3s_workers_iscsi_node.resources | length == 1
          - k3s_workers_iscsi_node.resources[0].status.nodeInfo.systemUUID | lower ==
            iscsi_initiator_current.smbios_uuid

    - name: Write generation observation without authorizing a workload
      delegate_to: localhost
      become: false
      ansible.builtin.copy:
        content: >-
          {{ iscsi_initiator_current | combine({'node_uid': k3s_workers_iscsi_node.resources[0].metadata.uid,
             'writer_authorized': false}) | to_nice_json }}
        dest: "{{ iscsi_initiator_review_root }}/{{ inventory_hostname }}-observed.json"
        mode: "0660"

    - name: Label only verified storage-ready worker generation
      delegate_to: localhost
      become: false
      kubernetes.core.k8s:
        kind: Node
        name: "{{ inventory_hostname }}"
        definition:
          metadata:
            labels:
              storage.starktastic.net/iscsi-ready: "true"
              storage.starktastic.net/node-uid: "{{ k3s_workers_iscsi_node.resources[0].metadata.uid }}"
              storage.starktastic.net/generation: "{{ iscsi_initiator_current.smbios_uuid }}"
