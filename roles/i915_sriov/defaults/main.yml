---
# i915 SR-IOV configuration defaults

# Number of virtual functions to create (max 7 for Intel UHD)
i915_max_vfs: 7

# Kernel compatibility range for current driver version
# See: https://github.com/strongtz/i915-sriov-dkms
i915_kernel_min: "6.12"
i915_kernel_max: "6.19"

# Optional: pin the host to a specific kernel.
# When set, the role builds and verifies the DKMS module for this kernel
# BEFORE pinning it via proxmox-boot-tool and rebooting into it. The kernel
# must already be installed and within the i915_kernel_min/max range.
# Leave empty to keep the currently pinned/running kernel.
i915_pinned_kernel: "6.17.13-13-pve"

# Required GRUB kernel parameters for the host
i915_grub_params: "intel_iommu=on i915.enable_guc=3 i915.max_vfs=7 module_blacklist=xe"

# Whether to reboot after upgrade if changes were made
i915_reboot_after_upgrade: true

# GitHub release URL template
i915_release_url:
  "https://github.com/strongtz/i915-sriov-dkms/releases/download/{{ i915_sriov_version }}/i915-sriov-dkms_{{
  i915_sriov_version }}_amd64.deb"
