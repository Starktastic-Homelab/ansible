---
# Apply proxmox_guest_startup ({vmid: "order=N,up=S"}) to existing guests, and make the host reboot on a
# kernel crash, with current CPU microcode, KSM off and kdump (off by default). Startup order, microcode and kdump
# take effect at the next host boot; nothing is restarted.

- name: Read guest configs
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ inventory_hostname }}/qemu/{{ item.key }}/config", --output-format, json]
  loop: "{{ proxmox_guest_startup | dict2items }}"
  register: proxmox_guest_startup_configs
  changed_when: false

- name: Set guest startup order and delay
  ansible.builtin.command:
    argv: [qm, set, "{{ item.item.key }}", --startup, "{{ item.item.value }}"]
  loop: "{{ proxmox_guest_startup_configs.results }}"
  loop_control:
    label: "{{ item.item.key }}: {{ item.item.value }}"
  when: (item.stdout | from_json).startup | default('') != item.item.value
  changed_when: true

# Crash recovery: a kernel oops or a failed ZFS assertion reboots the host, and the startup order above brings
# the guests back. Until 2026-11-10 an oops (ZFS arc_evict) killed one thread holding a ZFS lock, and the host
# stayed up but hung for 4.5 h. Panicking on hung or soft-locked tasks stays off: every TrueNAS restart stalls
# the hard NFS mounts from VM 100 for minutes, so the host would reboot-loop.
- name: Reboot 10 s after a kernel oops
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-panic-reboot.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: "kernel.panic_on_oops", value: "1" }
    - { key: "kernel.panic", value: "10" }

# spl_panic_halt is writable at runtime, so tmpfiles sets it at boot without rebuilding the initramfs.
- name: Panic instead of halting the thread on a failed ZFS assertion
  ansible.builtin.copy:
    dest: /etc/tmpfiles.d/spl-panic-halt.conf
    content: |
      # Managed by ansible (proxmox_guest_startup). A halted SPL thread keeps its locks and hangs ZFS.
      w /sys/module/spl/parameters/spl_panic_halt - - - - 1
    owner: root
    group: root
    mode: "0644"

- name: Read the running ZFS assertion setting
  ansible.builtin.slurp:
    src: /sys/module/spl/parameters/spl_panic_halt
  register: proxmox_guest_startup_spl_panic_halt

- name: Apply the ZFS assertion setting to the running kernel
  ansible.builtin.command:
    argv: [systemd-tmpfiles, --create, /etc/tmpfiles.d/spl-panic-halt.conf]
  when: proxmox_guest_startup_spl_panic_halt.content | b64decode | trim != '1'
  changed_when: true

# The BIOS loads microcode 0x36 on the i7-12700K; Debian's package loads a newer revision early in each boot (0x3d
# from 2026-11-10, installed by hand while ruling out memory corruption behind the ZFS oops). Host only: guests run
# on whatever the host loaded, so cluster rebuilds don't touch it. Needs non-free-firmware, which the host has.
- name: Install Intel CPU microcode
  ansible.builtin.apt:
    name: intel-microcode
    state: present
    update_cache: true

# KSM off (2026-11-15): two NFS-client oopses (10-23, 11-15) and a ZFS one (11-10) look like memory corruption, and
# 7.0.14-29 fixes KSM data loss in merged pages. Turning it off rules KSM out for ~1 GiB of RAM. run=2 also unmerges
# what ksmtuned merged; nothing else starts KSM, and run is 0 after a boot.
- name: Stop and disable the KSM tuning daemon
  ansible.builtin.systemd_service:
    name: ksmtuned
    state: stopped
    enabled: false

- name: Read the KSM state
  ansible.builtin.slurp:
    src: /sys/kernel/mm/ksm/run
  register: proxmox_guest_startup_ksm_run

- name: Stop KSM and unmerge shared pages
  ansible.builtin.command:
    argv: [sh, -c, "echo 2 > /sys/kernel/mm/ksm/run"]
  changed_when: true
  when: proxmox_guest_startup_ksm_run.content | b64decode | trim == '1'

# kdump (2026-11-15): save a vmcore on the next oops, to tell a kernel bug from a CPU fault behind the NFS-client
# crashes. Off by default (defaults/main.yml): the first test OOM'd at 1G and hung in the crash kernel. The crash
# kernel boots from a small kdump initrd that has no driver for the root pool unless listed here: rpool is a SATA
# mirror on the onboard AHCI controller, and both drivers are modules.
- name: Put the root pool's disk drivers in every initramfs
  ansible.builtin.lineinfile:
    path: /etc/initramfs-tools/modules
    line: "{{ item }}"
  loop: [ahci, sd_mod]

- name: Preseed kdump-tools
  ansible.builtin.debconf:
    name: "{{ item.name }}"
    question: "{{ item.question }}"
    vtype: boolean
    value: "{{ item.value }}"
  loop:
    # Package upgrades rewrite USE_KDUMP from this answer.
    - name: kdump-tools
      question: kdump-tools/use_kdump
      value: "{{ proxmox_guest_startup_kdump_enabled | bool | string | lower }}"
    # Normal reboots stay cold; kdump loads its kernel into the separate crash slot.
    - { name: kexec-tools, question: kexec-tools/use_grub_config, value: "false" }

# When enabled, kdump-tools.service fails until the host boots with crashkernel= below; that is expected.
- name: Install kdump
  ansible.builtin.apt:
    name: [kdump-tools, kexec-tools, makedumpfile]
    state: present

# The crash kernel gets the host's command line plus KDUMP_CMDLINE_APPEND (Debian's default first). It loads no GPU
# driver and leaves TrueNAS's HBA and NVMe drives alone (they bind to vfio-pci only when VM 100 starts). It reboots
# if it oopses, can't import rpool or stalls (hung tasks are safe to panic on here: the crash boot mounts no NFS).
# After saving the dump, kdump-tools reboots the host; a failed save reboots too (KDUMP_FAIL_CMD, FailureAction).
- name: Configure kdump
  ansible.builtin.lineinfile:
    path: /etc/default/kdump-tools
    regexp: "^#?\\s*{{ item.key }}="
    line: '{{ item.key }}="{{ item.value }}"'
    create: true # check mode skips the install, so the file may not exist yet
    mode: "0644"
  loop:
    - key: USE_KDUMP
      value: "{{ '1' if proxmox_guest_startup_kdump_enabled | bool else '0' }}"
    - key: KDUMP_FAIL_CMD
      value: "reboot -f"
    - key: MAKEDUMP_ARGS
      value: "-z -d 31"
    - key: KDUMP_NUM_DUMPS
      value: "2"
    - key: KDUMP_CMDLINE_APPEND
      value: >-
        reset_devices systemd.unit=kdump-tools-dump.service nr_cpus=1 irqpoll usbcore.nousb
        module_blacklist=xe,i915,mpt3sas,nvme panic=10 oops=panic hung_task_panic=1 softlockup_panic=1
  notify: Reload kdump

# Either unit can run the save in the crash boot; both are oneshot, which systemd never times out by itself.
- name: Create the kdump unit drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.service.d"
    state: directory
    mode: "0755"
  loop: [kdump-tools, kdump-tools-dump]

# The dump unit runs only in the crash boot, so its FailureAction never touches a normal boot.
- name: Force a reboot if saving the dump stalls or fails
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item }}.service.d/timeout.conf"
    content: |
      # Managed by ansible (proxmox_guest_startup). A stalled or failed crash boot would otherwise keep pve down.
      [Unit]
      JobTimeoutSec=30min
      JobTimeoutAction=reboot-force
      {{ 'FailureAction=reboot-force' if item == 'kdump-tools-dump' else '' }}
      [Service]
      TimeoutStartSec=30min
    mode: "0644"
  loop: [kdump-tools, kdump-tools-dump]
  notify: Reload systemd

# Enabled: left to start at the next boot, since it fails before crashkernel= is live.
- name: Enable or stop kdump
  ansible.builtin.systemd_service:
    name: kdump-tools
    enabled: "{{ proxmox_guest_startup_kdump_enabled | bool }}"
    state: "{{ omit if proxmox_guest_startup_kdump_enabled | bool else 'stopped' }}"

- name: Read the kernel command line
  ansible.builtin.slurp:
    src: /etc/kernel/cmdline
  register: proxmox_guest_startup_cmdline

# shortcut: systemd-boot hosts only (proxmox-boot-tool UEFI, like pve); a GRUB host needs /etc/default/grub instead.
# crash_kexec_post_notifiers writes the pstore record before kdump takes over; the backup crash guard relies on it.
# Disabled drops crashkernel=, which frees the reservation at the next boot.
- name: Set the crash kernel memory reservation
  ansible.builtin.copy:
    dest: /etc/kernel/cmdline
    content: "{{ wanted | join(' ') }}\n"
    mode: "0644"
    backup: true
  vars:
    current: "{{ (proxmox_guest_startup_cmdline.content | b64decode).split() }}"
    kept: "{{ current | reject('match', 'crashkernel=') | list }}"
    crashkernel:
      "{{ ['crashkernel=' ~ proxmox_guest_startup_crashkernel] if proxmox_guest_startup_kdump_enabled | bool else [] }}"
    missing: "{{ ['crash_kexec_post_notifiers'] | reject('in', kept) | list }}"
    wanted: "{{ kept + missing + crashkernel }}"
  when: wanted != current
  notify: Refresh boot tool
