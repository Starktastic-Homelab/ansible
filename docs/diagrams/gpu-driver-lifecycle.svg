<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="664" viewBox="0 0 1100 664" role="img" aria-labelledby="t d">
  <title id="t">GPU driver lifecycle: how a host driver change reaches the hardware</title>
  <desc id="d">On a pull request that changes the host driver pin i915_sriov_version, the required check i915-compat.yml runs scripts/i915_compat.py against the host driver and kernel from the pull request and the guest driver and kernel series read from debian.auto.pkrvars.hcl on packer's main branch. A person merges the pull request in a maintenance window. The push starts i915-sriov-upgrade.yml on the self-hosted runner: it checks the target, captures a baseline of every machine as the artifact i915-before, and installs the driver with i915-sriov.yml. The role schedules shutdown -r +1, so the host reboots and takes the runner with it. When the host is back, a person dispatches i915-acceptance.yml in post-reboot mode with the upgrade's run ID. It verifies the upgrade run, downloads i915-before, and requires fresh boots, the target's loaded versions and GPU probes on every worker.</desc>
  <defs>
