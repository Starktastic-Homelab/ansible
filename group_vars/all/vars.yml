---
ansible_user: debian
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

flannel_iface: eth1
vip_address: "10.9.9.99"
vip_service_cidrs: "10.9.9.90/32,10.9.8.90/32,10.9.8.91/32"

# Domain configuration
base_domain: "starktastic.net"
internal_domain: "internal.{{ base_domain }}"
argocd_url: "https://argocd.{{ internal_domain }}"
authentik_url: "https://auth.{{ base_domain }}"

argocd_repo_url: "https://github.com/Starktastic-Homelab/platform.git"

# K3s versions can be overridden here if needed
# Default values are defined in roles/k3s_init/defaults/main.yml
