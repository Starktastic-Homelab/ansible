---
# i915 SR-IOV configuration defaults

# Number of virtual functions to create (max 7 for Intel UHD)
i915_sriov_max_vfs: 7

# Kernel compatibility is not configured here: it comes from the upstream
# release metadata of the exact i915_sriov_version, checked by
# scripts/i915_compat.py before anything destructive happens.
# See: https://github.com/strongtz/i915-sriov-dkms

# Pin the host to a specific kernel. This is the authoritative desired host
# kernel: the role builds and verifies the DKMS module for it BEFORE pinning it
# via proxmox-boot-tool and rebooting into it, and CI validates the driver
# release against it. The kernel must already be installed.
# Leave empty to keep the currently pinned/running kernel (CI can then no
# longer validate the host axis and will fail closed).
i915_sriov_pinned_kernel: "6.17.13-13-pve"

# Required GRUB kernel parameters for the host
i915_sriov_grub_params: "intel_iommu=on i915.enable_guc=3 i915.max_vfs=7 module_blacklist=xe"

# Whether to reboot after upgrade if changes were made
i915_sriov_reboot_after_upgrade: true

# GitHub release URL template
i915_sriov_release_url:
  "https://github.com/strongtz/i915-sriov-dkms/releases/download/{{ i915_sriov_version }}/i915-sriov-dkms_{{
  i915_sriov_version }}_amd64.deb"
