---
- name: Set sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: "fs.inotify.max_user_instances", value: "512" }
    - { key: "fs.inotify.max_user_watches", value: "524288" }

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker Hub registry auth
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"

# ponytail: a one-line resolv.conf is the whole fix. Pods keep the stock
# ClusterFirst search list and ndots:5; they just stop inheriting the node's
# "search mgmt.arpa", which resolved nothing for them and turned every
# cluster-internal lookup into an extra NXDOMAIN forwarded to AdGuard.
- name: Provide kubelet a pod-safe resolver
  ansible.builtin.copy:
    content: "nameserver {{ k3s_common_upstream_dns }}\n"
    dest: "{{ k3s_common_resolv_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Point kubelet at the pod-safe resolver
  ansible.builtin.copy:
    content: |
      ---
      kubelet-arg:
        - "resolv-conf={{ k3s_common_resolv_conf }}"
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_common_k3s_binary

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_common_k3s_binary.stat.exists
