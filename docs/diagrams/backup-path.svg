<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="624" viewBox="0 0 1100 624" role="img" aria-labelledby="t d">
  <title id="t">Backup path: three streams from the host to one off-site restic repository</title>
  <desc id="d">Three streams leave the host. First, TrueNAS snapshots apps/k3s-block and apps/pv every six hours and replicates them raw into usbbk/tn on the encrypted USB pool usbbk; restic uploads them, with /etc, /root and mirrors of the five repositories, as the snapshot tagged daily. Second, a weekly vzdump on Sundays at 01:00 writes VM 100 and VM 300 to usbbk-vz; restic uploads the newest VM 300 dump as the snapshot tagged vzdump, and the VM 100 dump stays local. Third, the Immich originals on main/immich have no copy on usbbk; restic reads the share over read-only NFS and uploads it last as the snapshot tagged nfs. All three go to a restic repository on a Hetzner Storage Box over SFTP, which keeps its own weekly snapshots against deletion. Three systemd timers on the Proxmox host drive this, in Asia/Jerusalem time: homelab-backup-backup.timer daily at 04:30, homelab-backup-maint.timer on Sundays at 05:30, and homelab-backup-health.timer hourly. Every run pings healthchecks.io, which holds the checks pve-backup, pve-backup-maint and pve-health and alerts by email.</desc>
