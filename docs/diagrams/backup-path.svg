  <g class="t2" font-size="12.5">
    <text x="46" y="516">04:30 daily: refuses a replica</text>
    <text x="46" y="533">older than 8 h, then uploads the</text>
    <text x="46" y="550">three snapshots</text>
    <text x="300" y="516">Sundays 05:30: forgets and prunes</text>
    <text x="300" y="533">old snapshots, then checks 5% of</text>
    <text x="300" y="550">the repository data</text>
    <text x="554" y="516">hourly: pools, replica age and</text>
    <text x="554" y="533">recent kernel crash records</text>
  </g>
  <g class="t3" font-size="12.5">
    <text x="46" y="574">check <tspan class="t2 mono">pve-backup</tspan></text>
    <text x="300" y="574">check <tspan class="t2 mono">pve-backup-maint</tspan></text>
    <text x="554" y="574">check <tspan class="t2 mono">pve-health</tspan></text>
  </g>
