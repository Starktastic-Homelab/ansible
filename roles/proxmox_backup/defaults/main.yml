---
# Units and config are always installed; timers run and secrets are required only once this is true.
proxmox_backup_enabled: true

# /dev/disk/by-id name of the portable backup disk (pool usbbk): WD G-DRIVE mobile SSD, 1 TB.
proxmox_backup_usb_disk_id: "usb-G-DRIVE_mobile_SSD_B10180605416-0:0"
proxmox_backup_pool: usbbk

# TrueNAS replication pushes into usbbk/tn as tnrepl; the key is installed only once set.
# keychaincredential pve-usbbk (id 1) on TrueNAS.
# yamllint disable-line rule:line-length
proxmox_backup_truenas_pubkey:
  "ssh-rsa
  
  root@truenas"
proxmox_backup_truenas_sources: [10.9.9.30, 10.9.8.30]
# One permission per property TrueNAS sends with properties: true (quota and reservations are excluded on its side).
proxmox_backup_zfs_permissions:
  [copies, create, destroy, hold, mount, readonly, receive, release, rollback, snapdir, sync, userprop, xattr]

# Hetzner Storage Box BX11 sub-account (home "restic"); its key is /etc/homelab-backup/id_storagebox.
proxmox_backup_storagebox_host: u713697-sub1.your-storagebox.de
proxmox_backup_storagebox_user: u713697-sub1
# Host key as "type base64", from ssh-keyscan -p 23 -t ed25519; matches Hetzner's published
# SHA256:XqONwb1S0zuj5A1CDxpOSuD2hnAArV1A3wKY7Z3sdgM.
# yamllint disable-line rule:line-length
proxmox_backup_storagebox_hostkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIICf9svRenC/PLKIL9nk6K/pxQgoiFC41wTNvoIncOxs"
proxmox_backup_repository: sftp:storagebox:repo

proxmox_backup_max_replica_age_h: 8
proxmox_backup_sources:
  - { dataset: usbbk/tn/k3s-block, mount: k3s-block, raw_key: true }
  - { dataset: usbbk/tn/pv, mount: pv, raw_key: true }
# Write-once data too large for the portable disk (Immich originals) is read live over NFS instead:
# { share: "server:/path", mount: <dir>, marker: <file under the share> }. A share whose marker is missing
# is skipped and reported, so an empty export never becomes today's snapshot.
proxmox_backup_nfs_sources:
  # TrueNAS dataset main/immich, exported read-only to pve (NFS share 14) on the storage network.
  - { share: "10.9.9.30:/mnt/main/immich", mount: immich, marker: upload/.immich }

# Regenerable data; everything else in the sources goes off-site.
proxmox_backup_excludes:
  - /srv/backup-src/k3s-block/images/9999/vm-9999-prometheus.raw
  - /srv/backup-src/k3s-block/images/9999/vm-9999-loki.raw
  - /srv/backup-src/k3s-block/images/9999/vm-9999-tempo.raw
  - /srv/backup-src/k3s-block/images/9999/vm-9999-alertmanager.raw
  - /srv/backup-src/k3s-block/images/9999/vm-9999-karakeep-meilisearch.raw
  - /srv/backup-src/immich/thumbs
  - /srv/backup-src/immich/encoded-video

# Weekly VM300 dump (Garage Terraform state); vzdump runs with --compress 0, so the archive is a plain .vma.
proxmox_backup_vzdump_glob: /usbbk/vz/dump/vzdump-qemu-300-*.vma
proxmox_backup_dump_rules:
  - { glob: /srv/backup-src/pv/databases/pg-backup/pg_dumpall_*.sql.gz, max_age_h: 26, min_count: 1 }
  - { glob: /srv/backup-src/pv/cert-backup/cert-backup/*.yaml, max_age_h: 26, min_count: 1 }
  # Immich's own nightly database dump (02:00), on the share above.
  - { glob: /srv/backup-src/immich/backups/immich-db-backup-*.sql.gz, max_age_h: 26, min_count: 1 }
  - { glob: "{{ proxmox_backup_vzdump_glob }}", max_age_h: 192, min_count: 1 }
  # Weekly TrueNAS (VM100) boot-disk dump: stays local (the key kit holds its config), but must keep arriving.
  - { glob: /usbbk/vz/dump/vzdump-qemu-100-*.vma, max_age_h: 192, min_count: 1 }

proxmox_backup_git_repos:
  - https://github.com/Starktastic-Homelab/packer.git
  - https://github.com/Starktastic-Homelab/terraform.git
  - https://github.com/Starktastic-Homelab/ansible.git
  - https://github.com/Starktastic-Homelab/apps.git
  - https://github.com/Starktastic-Homelab/.github.git

proxmox_backup_schedules:
  backup: "*-*-* 04:30:00"
  maint: "Sun *-*-* 05:30:00"
  health: hourly

proxmox_backup_secrets: [restic.pass, id_storagebox, healthchecks.env, apps.key, usbbk.key]
