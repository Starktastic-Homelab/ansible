  <rect class="tile" x="122" y="126" width="36" height="36" rx="10.8"/><text class="acc" x="140" y="147.8" font-size="10" font-weight="800" text-anchor="middle">PR</text>
  <text class="t1" x="168" y="142" font-size="16" font-weight="800">Pull request</text>
  <text class="t2" x="168" y="160" font-size="12.5">changes the host pin</text>
  <path class="rule" d="M122 176H364"/>
  <text class="t1 mono" x="122" y="198" font-size="12.5">i915_sriov_version</text>
  <text class="t2" x="122" y="217" font-size="12.5">Renovate bumps wait for approval</text>

  <rect class="card" x="412" y="112" width="356" height="120" rx="20"/><rect class="rim" x="412.5" y="112.5" width="355" height="119" rx="19.5"/>
  <rect class="wf" x="426" y="126" width="200" height="28" rx="8"/><text class="wft mono" x="436" y="144.55" font-size="13">i915-compat.yml</text>
  <text class="t2" x="638" y="144.5" font-size="12.5">required check</text>
  <g class="t2" font-size="12.5">
    <text x="426" y="179"><tspan class="t1 mono">scripts/i915_compat.py</tspan> fails closed on:</text>
    <text x="426" y="198">host driver and kernel, guest driver and kernel,</text>
    <text x="426" y="217">and the ABI the two sides negotiate</text>
  </g>

  <rect class="card" x="820" y="112" width="250" height="120" rx="20"/><rect class="rim" x="820.5" y="112.5" width="249" height="119" rx="19.5"/>
  <rect class="tile" x="834" y="126" width="36" height="36" rx="10.8"/><use href="#i-packer" x="841.2" y="133.2" width="21.6" height="21.6"/>
  <text class="t1" x="880" y="142" font-size="16" font-weight="800">packer</text>
  <text class="t2" x="880" y="160" font-size="12.5">guest pin, read from main</text>
  <path class="rule" d="M834 176H1056"/>
  <text class="t1 mono" x="834" y="198" font-size="12.5">debian.auto.pkrvars.hcl</text>
  <text class="t2" x="834" y="217" font-size="12.5">guest driver and kernel series</text>

  <path class="edge" d="M380 172H402"/><path class="flow" d="M380 172H402"/><path class="head" d="M411 172l-10 -5.5v11.0z"/>
  <path class="side" d="M818 172H779"/><path class="sidehead" d="M769 172l9 -5v10z"/>

  <!-- merge gate -->
  <path class="gate" d="M108 254H1070"/>
  <rect class="hum" x="172" y="241" width="316" height="26" rx="13"/><text class="humt" x="330" y="258.68" font-size="13" text-anchor="middle">a person merges, in a maintenance window</text>
  <path class="edge" d="M590 234V266"/><path class="flow" d="M590 234V266"/><path class="head" d="M590 275l-5.5 -10h11.0z"/>

  <!-- on merge to main -->
  <rect class="card" x="108" y="276" width="600" height="160" rx="20"/><rect class="rim" x="108.5" y="276.5" width="599" height="159" rx="19.5"/>
  <rect class="wf" x="122" y="290" width="250" height="28" rx="8"/><text class="wft mono" x="132" y="308.55" font-size="13">i915-sriov-upgrade.yml</text><circle class="dot" cx="360" cy="304" r="3.5"/>
  <text class="t2" x="384" y="308.5" font-size="12.5">runs when the pin changes on main</text>
  <path class="rule" d="M122 332H694"/>
  <circle class="badge" cx="132" cy="354" r="10"/><text class="badget" x="132" y="358.5" font-size="13" font-weight="800" text-anchor="middle">1</text>
  <circle class="badge" cx="326" cy="354" r="10"/><text class="badget" x="326" y="358.5" font-size="13" font-weight="800" text-anchor="middle">2</text>
  <circle class="badge" cx="520" cy="354" r="10"/><text class="badget" x="520" y="358.5" font-size="13" font-weight="800" text-anchor="middle">3</text>
  <g class="t1" font-size="13.5" font-weight="700">
    <text x="150" y="358.5">Check the target</text>
    <text x="344" y="358.5">Capture a baseline</text>
    <text x="538" y="358.5">Install</text>
  </g>
  <g class="t2" font-size="12.5">
    <text x="122" y="384">freeze the target versions,</text>
    <text x="122" y="401">run <tspan class="mono">i915_compat.py</tspan> again</text>
    <text x="316" y="384">kernel, driver and boot ID</text>
    <text x="316" y="401">of the host and every node</text>
    <text x="510" y="384"><tspan class="mono">i915-sriov.yml</tspan>: driver,</text>
    <text x="510" y="401">kernel pin, boot parameters,</text>
    <text x="510" y="418">seven virtual functions</text>
  </g>

  <rect class="card" x="760" y="276" width="310" height="160" rx="20"/><rect class="rim" x="760.5" y="276.5" width="309" height="159" rx="19.5"/>
  <rect class="tile" x="774" y="290" width="36" height="36" rx="10.8"/><use href="#i-proxmox" x="781.2" y="297.2" width="21.6" height="21.6"/>
  <text class="t1" x="820" y="306" font-size="16" font-weight="800">The host reboots</text>
  <text class="t2" x="820" y="324" font-size="12.5">and takes the runner with it</text>
  <path class="rule" d="M774 340H1056"/>
  <g class="t2" font-size="12.5">
    <text x="774" y="364"><tspan class="t1 mono">shutdown -r +1</tspan>, a minute after</text>
    <text x="774" y="382">the play ends. The runner is a VM on</text>
    <text x="774" y="400">this host, so the workflow cannot</text>
    <text x="774" y="418">wait for the result.</text>
  </g>
  <path class="edge" d="M710 356H750"/><path class="flow" d="M710 356H750"/><path class="head" d="M759 356l-10 -5.5v11.0z"/>

  <!-- dispatch gate -->
  <path class="side" d="M408 438V490"/><path class="sidehead" d="M408 499l-5 -9h10z"/>
  <rect class="pill" x="346" y="445" width="124" height="22" rx="11"/><text class="pillt mono" x="408" y="460.5" font-size="12.5" text-anchor="middle">i915-before</text>
  <path class="gate" d="M108 478H1070"/>
  <rect class="hum" x="492" y="465" width="344" height="26" rx="13"/><text class="humt" x="664" y="482.68" font-size="13" text-anchor="middle">the host is back: a person dispatches the check</text>
  <path class="edge" d="M915 438V490"/><path class="flow" d="M915 438V490"/><path class="head" d="M915 499l-5.5 -10h11.0z"/>

  <!-- after the reboot -->
  <rect class="card" x="108" y="500" width="962" height="130" rx="20"/><rect class="rim" x="108.5" y="500.5" width="961" height="129" rx="19.5"/>
  <rect class="wf" x="122" y="514" width="210" height="28" rx="8"/><text class="wft mono" x="132" y="532.55" font-size="13">i915-acceptance.yml</text><circle class="dot" cx="320" cy="528" r="3.5"/>
  <rect class="tag" x="346" y="516" width="150" height="24" rx="12"/><text class="tagt mono" x="421" y="532.5" font-size="12.5" text-anchor="middle">mode=post-reboot</text>
  <rect class="tag" x="510" y="516" width="280" height="24" rx="12"/><text class="tagt mono" x="650" y="532.5" font-size="12.5" text-anchor="middle">installation_run_id=&lt;upgrade run&gt;</text>
  <path class="rule" d="M122 556H1056"/>
  <g class="t1" font-size="13.5" font-weight="700">
    <text x="122" y="578">The upgrade run</text>
    <text x="356" y="578">Fresh boots</text>
    <text x="590" y="578">Loaded versions</text>
    <text x="824" y="578">GPU probes</text>
  </g>
  <g class="t2" font-size="12.5">
    <text x="122" y="597">succeeded in this repository</text>
    <text x="122" y="614">and left its baseline</text>
    <text x="356" y="597">a new boot ID on the host</text>
    <text x="356" y="614">and on every cluster node</text>
    <text x="590" y="597">kernel and module match</text>
    <text x="590" y="614">the frozen target</text>
    <text x="824" y="597">H.264, HEVC, HDR tone mapping</text>
    <text x="824" y="614">and OpenCL on every worker</text>
  </g>
</svg>
