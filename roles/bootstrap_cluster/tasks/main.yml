---
- name: Configure Kube-Vip service ranges
  kubernetes.core.k8s:
    namespace: kube-system
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: kubevip
      data:
        cidr-global: "{{ vip_service_cidrs }}"
  tags:
    - bootstrap
    - kube-vip

- name: Pre-seed sealed-secrets master key
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sealed-secrets-key-bootstrap
        namespace: kube-system
        labels:
          sealedsecrets.bitnami.com/sealed-secrets-key: active
      type: kubernetes.io/tls
      data:
        tls.key: "{{ sealed_secrets_key_b64 }}"
        tls.crt: "{{ sealed_secrets_crt_b64 }}"
  tags:
    - bootstrap
    - sealed-secrets

- name: Restore TLS certs from NFS backup
  ansible.builtin.include_tasks: restore-certs.yml
  tags:
    - bootstrap
    - restore-certs

- name: Install helm-diff plugin
  kubernetes.core.helm_plugin:
    plugin_path: https://github.com/databus23/helm-diff
    state: present
  tags:
    - bootstrap
    - helm

- name: Setup ArgoCD
  ansible.builtin.include_tasks: argocd.yml
  tags:
    - bootstrap
    - argocd
