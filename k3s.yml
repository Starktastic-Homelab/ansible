---
- name: Wait for SSH availability on all nodes
  any_errors_fatal: true
  hosts: all_k3s
  gather_facts: false
  tags:
    - always
  tasks:
    - name: Wait for SSH to become available
      delegate_to: localhost
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 10
        timeout: 300

- name: Initialize k3s cluster
  any_errors_fatal: true
  hosts: masters[0]
  become: true
  gather_facts: true
  tags:
    - k3s
    - init
  roles:
    - role: k3s_init

- name: Harvest cluster token & VIP check
  any_errors_fatal: true
  hosts: masters[0]
  become: true
  gather_facts: false
  tags:
    - k3s
    - token
  tasks:
    - name: Fetch node token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_slurp

    - name: Set token fact globally
      ansible.builtin.set_fact:
        global_k3s_token: "{{ node_token_slurp['content'] | b64decode | trim }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['all_k3s'] }}"

    - name: Wait for API Server on VIP
      ansible.builtin.wait_for:
        host: "{{ vip_address }}"
        port: 6443
        timeout: 120
        state: started
      delegate_to: localhost

- name: Join additional masters
  any_errors_fatal: true
  hosts: masters[1:]
  become: true
  gather_facts: true
  tags:
    - k3s
    - masters
  roles:
    - role: k3s_masters

# Kubeconfig now addresses the current control plane. Retire stale worker
# identities before an agent with a fresh node password attempts to join.
- name: Retire verified replaced worker Nodes
  any_errors_fatal: true
  hosts: workers
  serial: 1
  become: true
  gather_facts: false
  tags:
    - k3s
    - workers
  roles:
    - role: k3s_node_retirement
      when:
        - k3s_node_retirement_enabled | default(false) | bool
        - not ansible_check_mode

- name: Join workers
  any_errors_fatal: true
  hosts: workers
  become: true
  gather_facts: true
  tags:
    - k3s
    - workers
  roles:
    - role: k3s_workers

# Terraform has already completed replacement. All installations above must
# succeed before restoring scheduling or starting the application bootstrap.
- name: Recover nodes drained by Terraform
  hosts: localhost
  any_errors_fatal: true
  gather_facts: false
  become: false
  tags:
    - k3s
    - bootstrap
  vars:
    k3s_drain_recovery_nodes: >-
      {{ lookup('ansible.builtin.env', 'K3S_DRAIN_RECOVERY_NODES', default='[]') | from_json }}
  tasks:
    - name: Validate drain handoff
      ansible.builtin.assert:
        that:
          - k3s_drain_recovery_nodes | type_debug == 'list'
          - k3s_drain_recovery_nodes | select('string') | list | length == k3s_drain_recovery_nodes | length
        fail_msg: Drain recovery requires a JSON list of node names from Terraform.

    - name: Restore scheduling after k3s installation
      when: k3s_drain_recovery_nodes | length > 0
      block:
        - name: Wait for current inventory nodes to register and become Ready
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Node
            name: "{{ item }}"
          register: k3s_drain_node
          until: >-
            k3s_drain_node.resources | length == 1 and (k3s_drain_node.resources[0].get('status', {}).get('conditions',
            []) | selectattr('type', 'equalto', 'Ready') | selectattr('status', 'equalto', 'True') | list | length > 0)
          retries: 60
          delay: 5
          loop: "{{ groups['all_k3s'] }}"

        - name: Uncordon surviving nodes that Terraform made unschedulable
          kubernetes.core.k8s:
            state: patched
            api_version: v1
            kind: Node
            name: "{{ item }}"
            definition:
              spec:
                unschedulable: false
          # Removed VMs need no recovery; surviving prior cordons stay held.
          loop: "{{ k3s_drain_recovery_nodes | intersect(groups['all_k3s']) | sort }}"

- name: Bootstrap cluster
  hosts: localhost
  gather_facts: false
  become: false
  tags:
    - bootstrap
    - argocd
  vars:
    vip_service_cidrs: "{{ hostvars[groups['masters'][0]]['vip_service_cidrs'] }}"
  roles:
    - role: bootstrap_cluster
