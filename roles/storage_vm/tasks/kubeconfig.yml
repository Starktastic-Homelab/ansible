---
# masters[0]: the i915-acceptance pattern. The kubeconfig never reaches a log, and the default one is untouched.
- name: Read the control-plane kubeconfig without logging credentials
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/k3s.yaml
  become: true
  register: storage_vm_kubeconfig_raw
  no_log: true

- name: Decode the private kubeconfig
  ansible.builtin.set_fact:
    storage_vm_kubeconfig: "{{ storage_vm_kubeconfig_raw.content | b64decode | from_yaml }}"
  no_log: true

- name: Require the expected single K3s cluster entry
  ansible.builtin.assert:
    that: storage_vm_kubeconfig.clusters | length == 1
  no_log: true

- name: Address the API at storage_vm_api_url
  ansible.builtin.set_fact:
    storage_vm_kubeconfig: >-
      {{ storage_vm_kubeconfig | combine({'clusters': [storage_vm_kubeconfig.clusters[0] | combine({'cluster':
         storage_vm_kubeconfig.clusters[0].cluster | combine({'server': storage_vm_api_url})})]}) }}
  no_log: true

- name: Allocate a private temporary kubeconfig on the controller
  ansible.builtin.tempfile:
    state: file
    prefix: storage-vm-
    suffix: .kubeconfig
  delegate_to: localhost
  become: false
  register: storage_vm_kubeconfig_file

- name: Write the temporary kubeconfig
  ansible.builtin.copy:
    dest: "{{ storage_vm_kubeconfig_file.path }}"
    content: "{{ storage_vm_kubeconfig | to_nice_yaml }}"
    mode: "0600"
  delegate_to: localhost
  become: false
  no_log: true

- name: Record the kubeconfig path
  ansible.builtin.set_fact:
    storage_vm_kubeconfig_path: "{{ storage_vm_kubeconfig_file.path }}"
