name: Deploy K3s Cluster

on:
  workflow_dispatch:

  repository_dispatch:
    types: [infrastructure-changed]

  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'renovate.json'
      - 'group_vars/proxmox_hosts/**'

jobs:
  provision:
    name: Apply Configuration
    runs-on: self-hosted
    container:
      image: python:trixie
    env:
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v6

      - name: Cache Pip Packages
        uses: actions/cache@v5.0.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Ansible and requirements
        run: pip install -r requirements.txt

      - name: Setup Helm
        uses: azure/setup-helm@v4.3.1
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: 'v3.20.0'

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 400 private_key.pem

      - name: Create Ansible Vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Run K3s Playbook
        run: |
          ansible-playbook -i inventory/proxmox.yml \
            --vault-password-file .vault_pass \
            --private-key private_key.pem \
            k3s.yml

      - name: Stage Kubeconfig
        run: cp ~/.kube/config ./kubeconfig_artifact

      - name: Upload Kubeconfig Artifact
        uses: actions/upload-artifact@v6
        with:
          name: kubeconfig
          path: kubeconfig_artifact
          retention-days: 1

  handoff:
    name: Push secret to Apps repo
    needs: provision
    runs-on: ubuntu-latest
    steps:
      - name: Download Kubeconfig Artifact
        uses: actions/download-artifact@v7
        with:
          name: kubeconfig
      
      - name: Update Apps repo secret
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_APPS_REPO_SECRET_UPDATER }}
        run: |
          gh secret set KUBECONFIG_RAW --repo Starktastic-Homelab/apps --body "$(cat kubeconfig_artifact)"
