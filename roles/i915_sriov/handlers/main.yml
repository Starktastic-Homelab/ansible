---
# Handlers run in the order they are DEFINED here, not the order notified.
# "Reboot host" MUST stay last so the config handlers (GRUB, initramfs, boot
# tool) finish before the deferred reboot fires and drops the connection.
- name: Update GRUB
  ansible.builtin.command: update-grub
  listen: grub updated

- name: Update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  listen: initramfs updated

- name: Refresh boot tool
  ansible.builtin.command: proxmox-boot-tool refresh
  listen: kernel pinned

- name: Reboot host
  # The GitHub Actions runner that drives this play lives on this Proxmox
  # node, so ansible.builtin.reboot cannot be used here: waiting for the host
  # to come back would kill our own runner. Schedule a deferred reboot via
  # systemd so the play finishes before the host goes down. `sync` flushes
  # pending initramfs/ESP writes to disk before the reboot fires.
  ansible.builtin.shell: sync && shutdown -r +1
  changed_when: true
  listen: reboot required
