- name: Create ArgoCD namespace
  kubernetes.core.k8s:
    api_version: v1
    name: argocd
    kind: Namespace

- name: Add ArgoCD helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "https://argoproj.github.io/argo-helm"

# Workaround: Helm 4 uses server-side apply by default. The ArgoCD controller
# (field-manager "argocd-controller") claims .data.context and
# .metadata.labels.app.kubernetes.io/name on argocd-notifications-cm, causing
# conflicts during helm upgrade. The kubernetes.core.helm module (v6.4.0) has no
# --force-conflicts support yet (tracked upstream:
# https://github.com/ansible-collections/kubernetes.core/issues/1038).
# This pre-task transfers field ownership to "helm" so the upgrade can proceed.
# Remove once kubernetes.core.helm gains a force_conflicts parameter.
- name: Transfer field ownership on notifications configmap for Helm 4 SSA
  kubernetes.core.k8s:
    state: present
    api_version: v1
    kind: ConfigMap
    namespace: argocd
    name: argocd-notifications-cm
    apply: true
    server_side_apply:
      field_manager: helm
      force_conflicts: true
    definition:
      metadata:
        labels:
          app.kubernetes.io/name: argocd-notifications-cm
      data:
        context: ""
  ignore_errors: true

- name: Install ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    release_namespace: argocd
    # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
    chart_version: "9.5.12"
    update_repo_cache: true
    wait: true
    timeout: 10m0s
    values:
      controller:
        replicas: 1
      server:
        replicas: 1
      repoServer:
        replicas: 1
      applicationSet:
        replicas: 1
      redis:
        enabled: true
      configs:
        params:
          applicationsetcontroller.enable.progressive.syncs: "true"
        secret:
          argocdServerAdminPassword: "{{ argocd_admin_password_hash }}"
          extra:
            oidc.authentik.clientID: "{{ argocd_oidc_client_id }}"
            oidc.authentik.clientSecret: "{{ argocd_oidc_client_secret }}"
        cm:
          url: "{{ argocd_url }}"
          accounts.homepage: apiKey
          oidc.config: |
            name: Authentik
            issuer: "{{ authentik_url }}/application/o/argo-cd/"
            clientID: "$oidc.authentik.clientID"
            clientSecret: "$oidc.authentik.clientSecret"
            requestedScopes: ["openid", "profile", "email", "groups"]
        rbac:
          policy.default: role:readonly
          scopes: "[groups]"
          policy.csv: |
            p, role:homepage, applications, get, */*, allow
            g, authentik Admins, role:admin
            g, homepage, role:homepage
      notifications:
        secret:
          create: false

# Workaround: ArgoCD creates ssoClientApp once at startup before its configmap
# informer syncs. The OIDC issuer is empty at that point and the in-process
# graceful restart does not recreate the SSO client. A rollout restart forces a
# fresh NewServer() after the configmap is cached, giving SSO the correct issuer.
- name: Restart ArgoCD server to pick up OIDC config
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-server
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: argocd
    label_selectors:
      - "app.kubernetes.io/name=argocd-server"
  register: argocd_server
  until: >
    argocd_server.resources | length > 0 and argocd_server.resources[0].status.updatedReplicas | default(0) ==
    argocd_server.resources[0].spec.replicas and argocd_server.resources[0].status.availableReplicas | default(0) ==
    argocd_server.resources[0].spec.replicas
  retries: 30
  delay: 10

- name: Apply app of apps bootstrap
  kubernetes.core.k8s:
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cluster-bootstrap
        namespace: argocd
        finalizers: ["resources-finalizer.argocd.argoproj.io"]
      spec:
        project: default
        source:
          repoURL: "{{ argocd_repo_url }}"
          targetRevision: HEAD
          path: bootstrap
          directory:
            recurse: true
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
