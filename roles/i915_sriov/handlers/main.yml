---
- name: Reboot host
  ansible.builtin.reboot:
    msg: "Rebooting for i915 SR-IOV driver update"
    reboot_timeout: 300
  listen: reboot required

- name: Update GRUB
  ansible.builtin.command: update-grub
  listen: grub updated

- name: Update initramfs
  ansible.builtin.command: update-initramfs -u -k all
  listen: initramfs updated

- name: Refresh boot tool
  ansible.builtin.command: proxmox-boot-tool refresh
  listen: kernel pinned
