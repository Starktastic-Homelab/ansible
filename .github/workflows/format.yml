name: Format

on:
  pull_request:
    branches: [main]

jobs:
  format:
    name: Format all YAML and JSON files
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.ORG_DISPATCH_TOKEN }}

      - name: Prettier
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --write **/*.{yaml,yml,json}
