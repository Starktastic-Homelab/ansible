---
- name: Set sysctl parameters for Kubernetes
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-kubernetes.conf
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { key: "fs.inotify.max_user_instances", value: "512" }
    - { key: "fs.inotify.max_user_watches", value: "524288" }

- name: Ensure K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Docker Hub registry auth
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"

# ponytail: copy the node's own resolver and drop its "search" line -- that is
# the whole fix, and it hardcodes no address. Terraform sets the nameserver via
# cloud-init, netplan hands it to systemd-resolved, and this reads it back out.
# Pods keep the stock ClusterFirst search list and ndots:5; they just stop
# inheriting "search mgmt.arpa". Any name with fewer than 5 dots -- every
# external hostname a pod resolves -- currently tries <name>.mgmt.arpa against
# AdGuard before the real name, costing a wasted NXDOMAIN and a round-trip.
- name: Read the resolver cloud-init configured on this node
  ansible.builtin.slurp:
    src: "{{ k3s_common_node_resolv_conf }}"
  register: k3s_common_node_resolv

- name: Extract its nameservers
  ansible.builtin.set_fact:
    k3s_common_nameservers: >-
      {{ k3s_common_node_resolv.content | b64decode
         | regex_findall('(?m)^nameserver[ \t]+\S+') }}

- name: Refuse to write an empty resolver
  ansible.builtin.assert:
    that: k3s_common_nameservers | length > 0
    fail_msg: >-
      No nameserver in {{ k3s_common_node_resolv_conf }}. Writing an empty {{ k3s_common_resolv_conf }} would leave
      CoreDNS with no upstream and break every external name in the cluster.

- name: Provide kubelet a pod-safe resolver
  ansible.builtin.copy:
    content: "{{ k3s_common_nameservers | join('\n') }}\n"
    dest: "{{ k3s_common_resolv_conf }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Write the K3s node config
  ansible.builtin.copy:
    content: |
      ---
      kubelet-arg:
        - "resolv-conf={{ k3s_common_resolv_conf }}"
      {% if 'masters' in group_names %}
      kube-controller-manager-arg:
      {% for arg in k3s_common_leader_elect_args %}
        - "{{ arg }}"
      {% endfor %}
      kube-cloud-controller-manager-arg:
      {% for arg in k3s_common_leader_elect_args %}
        - "{{ arg }}"
      {% endfor %}
      kube-scheduler-arg:
      {% for arg in k3s_common_leader_elect_args %}
        - "{{ arg }}"
      {% endfor %}
      {% endif %}
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Configure K3s internal leader election
  ansible.builtin.copy:
    content: |
      CATTLE_ELECTION_LEASE_DURATION={{ k3s_common_leader_elect_lease_duration }}
      CATTLE_ELECTION_RENEW_DEADLINE={{ k3s_common_leader_elect_renew_deadline }}
      CATTLE_ELECTION_RETRY_PERIOD={{ k3s_common_leader_elect_retry_period }}
    dest: /etc/default/k3s
    owner: root
    group: root
    mode: "0644"
  when: "'masters' in group_names"
  notify: Restart k3s

- name: Check if K3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_common_k3s_binary

- name: Download K3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_common_k3s_binary.stat.exists
