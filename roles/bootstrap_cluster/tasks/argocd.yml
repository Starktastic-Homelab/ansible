- name: Add ArgoCD helm repo
  kubernetes.core.helm_repository:
    name: argo
    repo_url: "https://argoproj.github.io/argo-helm"

- name: Check ArgoCD release status
  ansible.builtin.command:
    cmd: helm status argocd --namespace argocd -o json
  register: bootstrap_cluster_argocd_release_status
  changed_when: false
  failed_when: false

# A deploy interrupted mid `helm upgrade` leaves the release in a pending-*
# state (pending-install/upgrade/rollback), which wedges every subsequent
# upgrade with "another operation in progress". Roll back to the last good
# revision so the install below can proceed. Needs the same
# --server-side/--force-conflicts treatment as the install below: the rollback
# re-applies the same manifests and hits the identical argocd-controller
# field-manager conflict on argocd-notifications-cm.
- name: Recover ArgoCD release stuck in a pending state
  ansible.builtin.command:
    cmd: >-
      helm rollback argocd --namespace argocd --wait --timeout 5m0s --server-side=true --force-conflicts
  when:
    - bootstrap_cluster_argocd_release_status.rc == 0
    - (bootstrap_cluster_argocd_release_status.stdout | from_json).info.status is search('pending-')
  changed_when: true

- name: Install ArgoCD
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo/argo-cd
    # renovate: datasource=helm depName=argo-cd registryUrl=https://argoproj.github.io/argo-helm
    chart_version: "10.4.1"
    release_namespace: argocd
    create_namespace: true
    update_repo_cache: true
    wait: true
    wait_timeout: 10m0s
    # The ArgoCD controller (field-manager "argocd-controller") claims
    # .data.context and .metadata.labels.app.kubernetes.io/name on
    # argocd-notifications-cm, so a client-side apply dies on those conflicts.
    server_side: "true"
    force_conflicts: true
    release_values:
      controller:
        replicas: 1
        resources:
          requests:
            memory: 512Mi
      server:
        replicas: 1
      repoServer:
        replicas: 1
      applicationSet:
        replicas: 1
      redis:
        enabled: true
      configs:
        params:
          applicationsetcontroller.enable.progressive.syncs: "true"
        secret:
          argocdServerAdminPassword: "{{ argocd_admin_password_hash }}"
          # The chart defaults this to `now`, so every render differs, helm-diff
          # always reports a change, and every run cuts a real release revision
          # and rolls argocd-server. It also invalidates live admin API tokens,
          # which ArgoCD rejects when issued before admin.passwordMtime.
          # Pinned to the value already in the cluster; bump it only when
          # rotating argocd_admin_password_hash.
          argocdServerAdminPasswordMtime: "2026-08-23T12:26:14Z"
          extra:
            oidc.authentik.clientID: "{{ argocd_oidc_client_id }}"
            oidc.authentik.clientSecret: "{{ argocd_oidc_client_secret }}"
        cm:
          url: "{{ argocd_url }}"
          accounts.homepage: apiKey
          oidc.config: |
            name: Authentik
            issuer: "{{ authentik_url }}/application/o/argo-cd/"
            clientID: "$oidc.authentik.clientID"
            clientSecret: "$oidc.authentik.clientSecret"
            requestedScopes: ["openid", "profile", "email", "groups"]
        rbac:
          policy.default: role:readonly
          scopes: "[groups]"
          policy.csv: |
            p, role:homepage, applications, get, */*, allow
            g, authentik Admins, role:admin
            g, homepage, role:homepage
      # argocd-notifications-cm and -secret both belong to the apps repo:
      # infra-configs declares every key of the ConfigMap, and letting the chart
      # render its own copy makes helm and argocd-controller fight over
      # .data.context -- helm wins via --force-conflicts and leaves the chart
      # placeholder argocdUrl (https://argocd.example.com) live, breaking the
      # "Open ArgoCD" link in every ntfy notification.
      notifications:
        cm:
          create: false
        secret:
          create: false
  # release_values carries the admin password hash and the OIDC client secret.
  no_log: true
  register: bootstrap_cluster_argocd

# Workaround: ArgoCD creates ssoClientApp once at startup before its configmap
# informer syncs. The OIDC issuer is empty at that point and the in-process
# graceful restart does not recreate the SSO client. A rollout restart forces a
# fresh NewServer() after the configmap is cached, giving SSO the correct issuer.
# Only a run that actually touched the release can hit that race, so gate on the
# helm result -- an unchanged release is already serving the right issuer.
- name: Restart ArgoCD server to pick up OIDC config # noqa: no-handler
  kubernetes.core.k8s:
    api_version: apps/v1
    kind: Deployment
    namespace: argocd
    name: argocd-server
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  when: bootstrap_cluster_argocd is changed

- name: Wait for ArgoCD server to be ready
  kubernetes.core.k8s_info:
    kind: Deployment
    namespace: argocd
    label_selectors:
      - "app.kubernetes.io/name=argocd-server"
  register: bootstrap_cluster_argocd_server
  until: >
    bootstrap_cluster_argocd_server.resources | length > 0 and
    bootstrap_cluster_argocd_server.resources[0].status.observedGeneration | default(0) ==
    bootstrap_cluster_argocd_server.resources[0].metadata.generation and
    bootstrap_cluster_argocd_server.resources[0].status.updatedReplicas | default(0) ==
    bootstrap_cluster_argocd_server.resources[0].spec.replicas and
    bootstrap_cluster_argocd_server.resources[0].status.availableReplicas | default(0) ==
    bootstrap_cluster_argocd_server.resources[0].spec.replicas
  retries: 30
  delay: 10

- name: Apply app of apps bootstrap
  kubernetes.core.k8s:
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: Application
      metadata:
        name: cluster-bootstrap
        namespace: argocd
        finalizers: ["resources-finalizer.argocd.argoproj.io"]
      spec:
        project: default
        source:
          repoURL: "{{ argocd_repo_url }}"
          targetRevision: HEAD
          path: bootstrap
          directory:
            recurse: true
        destination:
          server: https://kubernetes.default.svc
          namespace: argocd
        syncPolicy:
          automated:
            prune: true
            selfHeal: true
