---
# storage, before the maintenance lock: the same code against the real ledger, reading only (vgs, lvs).
- name: Check the storage VM settings
  ansible.builtin.import_tasks: assert.yml

- name: Dry-run the reconcile from a private copy
  block:
    - name: Create a private dry-run directory
      ansible.builtin.tempfile:
        state: directory
        prefix: storage-dry-run-
      register: storage_vm_dry_run_dir

    - name: Copy the reconcile package
      ansible.builtin.copy:
        src: homelab_storage
        dest: "{{ storage_vm_dry_run_dir.path }}/"
        mode: "0644"
        directory_mode: "0700"

    - name: Copy the reconcile wrapper
      ansible.builtin.copy:
        src: storage-reconcile
        dest: "{{ storage_vm_dry_run_dir.path }}/storage-reconcile"
        mode: "0700"

    - name: Copy the inventory at the logged commit
      ansible.builtin.copy:
        src: "{{ hostvars['localhost'].storage_vm_inventory_file }}"
        dest: "{{ storage_vm_dry_run_dir.path }}/retained-volumes.json"
        mode: "0600"

    - name: Render the config the run will install
      ansible.builtin.template:
        src: config.json.j2
        dest: "{{ storage_vm_dry_run_dir.path }}/config.json"
        mode: "0600"

    - name: Dry-run the reconcile against the real ledger
      ansible.builtin.command:
        argv: [python3, -I, "{{ storage_vm_dry_run_dir.path }}/storage-reconcile", apply, --dry-run,
               --inventory, "{{ storage_vm_dry_run_dir.path }}/retained-volumes.json",
               --config, "{{ storage_vm_dry_run_dir.path }}/config.json"]
      changed_when: false
  always:
    - name: Remove the dry-run directory
      ansible.builtin.file:
        path: "{{ storage_vm_dry_run_dir.path }}"
        state: absent
      when: storage_vm_dry_run_dir.path is defined
