---
ansible_user: debian
ansible_ssh_common_args: "-o StrictHostKeyChecking=no"

mgmt_iface: eth0
flannel_iface: eth1
# The production kube-vip address; the lab guard (tasks/lab-guard.yml) refuses a lab run that would use it.
production_vip_address: "10.9.9.99"
vip_address: "{{ production_vip_address }}"

# Domain configuration
base_domain: "starktastic.net"
internal_domain: "internal.{{ base_domain }}"
argocd_url: "https://argocd.{{ internal_domain }}"
authentik_url: "https://auth.{{ base_domain }}"

argocd_repo_url: "https://github.com/Starktastic-Homelab/apps.git"

# iSCSI initiator name of every k3s node is this prefix plus its hostname; the storage VM's ACLs use the same.
storage_initiator_iqn_prefix: "iqn.2026-11.net.starktastic:"

# NFS storage
nfs_server: "10.9.8.30"
nfs_base_path: "/mnt/apps/pv"

# K3s version to install
# renovate: datasource=github-releases depName=k3s-io/k3s
k3s_version: "v1.37.2+k3s1"
