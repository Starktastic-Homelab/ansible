---
- name: Require reviewed dependency identities and matching platform
  ansible.builtin.assert:
    that:
      - maintenance_runner_executor_kubectl_version is match('^v[0-9]+\.[0-9]+\.[0-9]+$')
      - maintenance_runner_executor_kubectl_sha256 is match('^[0-9a-f]{64}$')
      - maintenance_runner_executor_kubectl_arch in ['amd64', 'arm64']
      - ansible_facts.architecture == {'amd64':'x86_64', 'arm64':'aarch64'}[maintenance_runner_executor_kubectl_arch]
      - maintenance_runner_executor_websocket_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - maintenance_runner_executor_websocket_sha256 is match('^[0-9a-f]{64}$')
      - maintenance_runner_executor_websocket_url is
        match('^https://files\.pythonhosted\.org/packages/[a-zA-Z0-9_./-]+\.whl$')

- name: Read pinned Apps transport requirement
  ansible.builtin.slurp:
    src: "{{ maintenance_runner_executor_staging.path }}/apps/scripts/storage/requirements.txt"
  register: maintenance_runner_executor_requirement

- name: Require exact transport pin agreement
  ansible.builtin.assert:
    that:
      - maintenance_runner_executor_requirement.content | b64decode | trim == 'websocket-client==' +
        maintenance_runner_executor_websocket_version

- name: Create isolated dependency directories
  ansible.builtin.file:
    path: "{{ maintenance_runner_executor_staging.path }}/dependencies/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [bin, python]

- name: Download checksum-pinned kubectl
  ansible.builtin.get_url:
    url:
      "https://dl.k8s.io/release/{{ maintenance_runner_executor_kubectl_version }}/bin/linux/{{
      maintenance_runner_executor_kubectl_arch }}/kubectl"
    checksum: "sha256:{{ maintenance_runner_executor_kubectl_sha256 }}"
    dest: "{{ maintenance_runner_executor_staging.path }}/dependencies/bin/kubectl"
    mode: "0755"

- name: Download checksum-pinned transport wheel
  ansible.builtin.get_url:
    url: "{{ maintenance_runner_executor_websocket_url }}"
    checksum: "sha256:{{ maintenance_runner_executor_websocket_sha256 }}"
    dest:
      "{{ maintenance_runner_executor_staging.path }}/dependencies/python/websocket_client-{{
      maintenance_runner_executor_websocket_version }}-py3-none-any.whl"
    mode: "0644"
