name: Reconcile retained storage

# ADR 0017 "How a run works": skip until configured (and, on schedule, inside a backup window), dry-run without the
# lock, try the lock once, reconcile under it, release only after success. A failed run keeps the lock (D31).
on:
  # held_lock_owner: the restore runbook (apps docs/runbooks/storage-vm-restore.md) holds the lock and reconciles under
  # it (D51). Empty takes the lock as every other trigger does.
  workflow_dispatch:
    inputs:
      held_lock_owner:
        description: Owner of the held storage-restore lock to reconcile under; empty takes the lock
        required: false
        default: ''
        type: string
      # A deliberate worker removal (roles/storage_vm/tasks/assert.yml): names, comma or space separated, approved to
      # leave the installed config.json for this run only. Any other worker missing from the inventory is refused.
      remove_workers:
        description: Workers approved to leave the storage VM config this run (names); empty approves none
        required: false
        default: ''
        type: string

  # Sent by apps on an inventory change. The run always reconciles the branch tip, never a payload SHA.
  repository_dispatch:
    types: [storage-changed]

  # The backstop after a lost dispatch or a lock-held skip. UTC; storage_ready.py skips the backup windows.
  schedule:
    - cron: '5 * * * *'

  push:
    branches:
      - main
    paths:
      - 'group_vars/storage/**'
      - 'roles/storage_vm/**'
      - 'storage-dry-run.yml'
      - 'storage-host-metrics.yml'
      - 'storage-play-*.yml'
      - 'storage.yml'

concurrency:
  group: storage-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile the storage VM
    runs-on: self-hosted
    timeout-minutes: 30
    container:
      # Match deploy.yml; Ansible 2.21 fails to import under Python 3.15.
      image: python:3.14-trixie
      volumes:
        - /var/lib/homelab-maintenance:/maintenance
    env:
      HOMELAB_RUNNER_INSTANCE: cc1aeeb7-4827-466c-9d4b-5dc6c881f193
      # A dispatch that adopts a held lock runs as its owner; the adopt step validates it before any lock step.
      MAINTENANCE_OWNER: ${{ inputs.held_lock_owner || format('{0}/{1}/{2}', github.repository, github.run_id, github.run_attempt) }}
      PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
      PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
      PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
      PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Checkout reviewed maintenance helper
        uses: actions/checkout@v7
        with:
          repository: Starktastic-Homelab/ansible
          ref: 887269798650e88fed791bb4f22a47bf50ad17be
          path: maintenance-helper
          persist-credentials: false

      - name: Cache Pip Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Ansible and requirements
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force

      - name: Prepare private connection credentials
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          umask 077
          printf '%s\n' "$SSH_PRIVATE_KEY" > private_key.pem
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > .vault_pass

      - name: Check that the storage VM is configured
        id: ready
        run: python3 scripts/storage_ready.py

      # The dispatch approvals for this run, validated; both playbooks read only this file (-e @), never a raw input.
      - name: Validate the dispatch approvals
        id: approvals
        if: steps.ready.outputs.ready == 'true'
        env:
          REMOVE_WORKERS: ${{ inputs.remove_workers }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, sys
          approvals = {}
          workers = os.environ.get('REMOVE_WORKERS', '').replace(',', ' ').split()
          for name in workers:
              if not re.fullmatch(r'[a-z0-9]([a-z0-9.-]*[a-z0-9])?', name):
                  sys.exit(f'remove_workers: {name!r} is not a worker name')
          if workers:
              approvals['storage_vm_remove_workers'] = sorted(set(workers))
          with open('storage-approvals.json', 'w') as stream:
              json.dump(approvals, stream)
          print('Approvals for this run:', json.dumps(approvals))
          PY

      # Gauges only (df on pve, the lock record, one textfile on the storage VM): no lock, and it runs inside the
      # backup windows and while another operation holds the lock, so MaintenanceLockStale sees the real holder.
      # proxmox_hosts is only in inventory/hosts.yml; pve logs in with its vaulted password, hence sshpass.
      - name: Write host gauges
        if: steps.ready.outputs.gauges == 'true'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          apt-get update && apt-get install -y sshpass
          ansible-playbook -i inventory/proxmox.yml -i inventory/hosts.yml \
            --vault-password-file .vault_pass \
            --private-key private_key.pem \
            storage-host-metrics.yml

      - name: Skip while another maintenance operation runs
        id: held
        if: steps.ready.outputs.ready == 'true'
        run: |
          if test -e /maintenance/operation.json; then
            echo '::warning::Maintenance lock is held; skipping, the next hourly run retries'
            echo 'held=true' >> "$GITHUB_OUTPUT"
          else
            echo 'held=false' >> "$GITHUB_OUTPUT"
          fi

      # D51: adopt the runbook's held lock, never take or release it. The record is root-only on the runner; the nonce
      # is masked before it reaches GITHUB_ENV and never printed. A refusal ends the run before the reconcile.
      - name: Adopt the runbook's held lock
        id: adopt
        if: >-
          steps.ready.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
          && inputs.held_lock_owner != ''
        env:
          HELD_LOCK_OWNER: ${{ inputs.held_lock_owner }}
        run: |
          python3 -I - <<'PY'
          import json, os, re, sys
          owner = os.environ['HELD_LOCK_OWNER']
          if not re.fullmatch(r'claude-code/storage-restore/[0-9TZ:-]+', owner):
              sys.exit('held_lock_owner is not a claude-code/storage-restore/<UTC ts> owner')
          try:
              with open('/maintenance/operation.json') as stream:
                  record = json.load(stream)
          except FileNotFoundError:
              sys.exit('No maintenance lock is held')
          if record.get('owner') != owner:
              sys.exit('The maintenance lock is held by another owner')
          if record.get('operation') != 'storage-cutover:storage-restore':  # lock.sh acquire storage-restore
              sys.exit('The maintenance lock is not the restore runbook\'s')
          nonce = record.get('nonce')
          if not isinstance(nonce, str) or not re.fullmatch(r'[0-9a-f]{64}', nonce):
              sys.exit('The maintenance record has no valid nonce')
          print('::add-mask::' + nonce)
          with open(os.environ['GITHUB_ENV'], 'a') as stream:
              stream.write('MAINTENANCE_OWNER=' + owner + '\nMAINTENANCE_NONCE=' + nonce + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('adopted=true\n')
          PY

      # A refusal here ends the run before it touches the lock.
      - name: Dry-run before the lock
        if: steps.ready.outputs.ready == 'true' && steps.held.outputs.held != 'true'
        run: |
          ansible-playbook -i inventory/proxmox.yml \
            --vault-password-file .vault_pass \
            --private-key private_key.pem \
            -e @storage-approvals.json \
            storage-dry-run.yml

      # The pinned helper's acquire fails on a held lock, so check first: a lock taken in between fails the run.
      - name: Try the maintenance lock once
        id: lock
        if: >-
          steps.ready.outputs.ready == 'true' && steps.held.outputs.held != 'true'
          && steps.adopt.outputs.adopted != 'true'
        run: |
          if test -e /maintenance/operation.json; then
            echo '::warning::Maintenance lock is held; skipping, the next hourly run retries'
            echo 'acquired=false' >> "$GITHUB_OUTPUT"
          else
            python3 maintenance-helper/scripts/maintenance_lock.py acquire --operation ansible-storage --github-env
            echo 'acquired=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconcile under the lock
        if: steps.lock.outputs.acquired == 'true' || steps.adopt.outputs.adopted == 'true'
        run: |
          python3 maintenance-helper/scripts/maintenance_lock.py verify
          ansible-playbook -i inventory/proxmox.yml \
            --vault-password-file .vault_pass \
            --private-key private_key.pem \
            -e @storage-approvals.json \
            storage.yml

      # No always(): a failed run keeps the lock for a human to read the log (D31, as deploy.yml).
      - name: Release the lock after success
        if: steps.lock.outputs.acquired == 'true'
        run: python3 maintenance-helper/scripts/maintenance_lock.py release

      - name: Remove private controller credentials
        if: always()
        run: rm -f .vault_pass private_key.pem storage-approvals.json
