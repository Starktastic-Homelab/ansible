---
- name: Set master delegation target
  ansible.builtin.set_fact:
    bootstrap_cluster_cert_master: "{{ groups['masters'][0] }}"
  tags:
    - bootstrap
    - restore-certs

- name: Create cert backup mount point on master
  ansible.builtin.file:
    path: /tmp/cert-backup
    state: directory
    mode: "0755"
  delegate_to: "{{ bootstrap_cluster_cert_master }}"
  become: true
  tags:
    - bootstrap
    - restore-certs

# Deliberate transient mount used purely as a probe: its failure (no backup
# share on first deploy) drives the skip logic below, so the declarative
# ansible.posix.mount module is the wrong tool here.
- name: Mount cert backup NFS share on master # noqa: command-instead-of-module
  ansible.builtin.command:
    cmd:
      mount -t nfs -o ro,noatime,nfsvers=4.1 {{ nfs_server }}:{{ nfs_base_path }}/cert-backup/cert-backup
      /tmp/cert-backup
  delegate_to: "{{ bootstrap_cluster_cert_master }}"
  become: true
  register: bootstrap_cluster_nfs_mount
  ignore_errors: true
  changed_when: bootstrap_cluster_nfs_mount.rc == 0
  tags:
    - bootstrap
    - restore-certs

- name: Find backed up cert secrets on master
  ansible.builtin.find:
    paths: /tmp/cert-backup
    patterns: "*.yaml"
  delegate_to: "{{ bootstrap_cluster_cert_master }}"
  become: true
  register: bootstrap_cluster_cert_backup_files
  when: bootstrap_cluster_nfs_mount is succeeded
  tags:
    - bootstrap
    - restore-certs

- name: Display found backup files
  ansible.builtin.debug:
    msg: "Found cert backups: {{ bootstrap_cluster_cert_backup_files.files | map(attribute='path') | list }}"
  when:
    - bootstrap_cluster_nfs_mount is succeeded
    - bootstrap_cluster_cert_backup_files.matched > 0
  tags:
    - bootstrap
    - restore-certs

- name: Fetch cert backup files to runner
  ansible.builtin.fetch:
    src: "{{ item.path }}"
    dest: /tmp/cert-restore/
    flat: true
  delegate_to: "{{ bootstrap_cluster_cert_master }}"
  become: true
  loop: "{{ bootstrap_cluster_cert_backup_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - bootstrap_cluster_nfs_mount is succeeded
    - bootstrap_cluster_cert_backup_files.matched > 0
  tags:
    - bootstrap
    - restore-certs

- name: Unmount cert backup NFS share on master
  ansible.builtin.command:
    cmd: umount /tmp/cert-backup
  delegate_to: "{{ bootstrap_cluster_cert_master }}"
  become: true
  when: bootstrap_cluster_nfs_mount is succeeded
  changed_when: true
  tags:
    - bootstrap
    - restore-certs

- name: Remove cert backup mount point on master
  ansible.builtin.file:
    path: /tmp/cert-backup
    state: absent
  delegate_to: "{{ bootstrap_cluster_cert_master }}"
  become: true
  tags:
    - bootstrap
    - restore-certs

- name: Find fetched cert files on runner
  ansible.builtin.find:
    paths: /tmp/cert-restore
    patterns: "*.yaml"
  register: bootstrap_cluster_cert_local_files
  when:
    - bootstrap_cluster_nfs_mount is succeeded
    - bootstrap_cluster_cert_backup_files.matched > 0
  tags:
    - bootstrap
    - restore-certs

- name: Extract namespaces from backup filenames
  ansible.builtin.set_fact:
    bootstrap_cluster_cert_backup_namespaces:
      "{{ bootstrap_cluster_cert_local_files.files | map(attribute='path') | map('basename') | map('regex_replace',
      '--.*$', '') | unique | list }}"
  when:
    - bootstrap_cluster_cert_local_files is defined
    - bootstrap_cluster_cert_local_files.files | default([]) | length > 0
  tags:
    - bootstrap
    - restore-certs

- name: Ensure target namespaces exist
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: "{{ item }}"
    state: present
  loop: "{{ bootstrap_cluster_cert_backup_namespaces }}"
  when:
    - bootstrap_cluster_cert_backup_namespaces is defined
    - bootstrap_cluster_cert_backup_namespaces | length > 0
  tags:
    - bootstrap
    - restore-certs

- name: Restore cert secrets from backup
  kubernetes.core.k8s:
    state: present
    src: "{{ item.path }}"
  loop: "{{ bootstrap_cluster_cert_local_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - bootstrap_cluster_cert_local_files is defined
    - bootstrap_cluster_cert_local_files.files | default([]) | length > 0
  failed_when: false
  tags:
    - bootstrap
    - restore-certs

- name: Remove fetched cert files from runner
  ansible.builtin.file:
    path: /tmp/cert-restore
    state: absent
  tags:
    - bootstrap
    - restore-certs

- name: Cert backup restore skipped (no NFS backup found)
  ansible.builtin.debug:
    msg: "No cert backup NFS share found - skipping restore (expected on first deploy)"
  when: bootstrap_cluster_nfs_mount is failed
  tags:
    - bootstrap
    - restore-certs
