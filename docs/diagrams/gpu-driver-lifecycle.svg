  <text class="acc" x="40" y="52" font-size="14" font-weight="700" letter-spacing="3">GPU DRIVER LIFECYCLE</text>
  <text class="t1" x="40" y="86" font-size="26" font-weight="800">From a driver pin to proven hardware</text>
  <g class="t2" font-size="13.5">
    <path class="edge" d="M690 48H734"/><path class="flow" d="M690 48H734"/>
    <text x="744" y="52.5">trigger</text>
    <path class="side" d="M690 76H734"/>
    <text x="744" y="80.5">data handed on</text>
    <circle class="dot" cx="902" cy="48" r="4"/>
    <text x="914" y="52.5">self-hosted runner</text>
    <path class="gate" d="M894 76H910"/>
    <text x="914" y="80.5">a person</text>
  </g>

  <g class="acc" font-size="10.5" font-weight="700" letter-spacing="1">
    <text x="32" y="168">ON PULL</text>
    <text x="32" y="183">REQUEST</text>
    <text x="32" y="352">ON MERGE</text>
    <text x="32" y="367">TO MAIN</text>
    <text x="32" y="553">AFTER</text>
    <text x="32" y="568">THE</text>
    <text x="32" y="583">REBOOT</text>
  </g>

  <!-- on pull request -->
