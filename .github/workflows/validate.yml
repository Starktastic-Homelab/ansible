---
name: Validate Ansible playbook
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'renovate.json'

jobs:
  lint:
    name: Ansible Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Cache Pip Packages
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Test maintenance ownership and execution
        run: python3 -m unittest discover -s scripts/tests -p 'test_maintenance*.py' -v

      - name: Install ansible-lint
        run: pip install ansible-lint

      # Offline syntax-check must resolve FQCN modules, so the collections
      # need to be present locally before ansible-lint runs.
      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      # ansible.cfg sets vault_password_file; ansible-lint's syntax-check needs
      # the file to exist. A dummy password is fine — decryption isn't required.
      - name: Create dummy Ansible Vault password file
        run: echo "dummy" > .vault_pass

      - name: Test Proxmox CSI bootstrap rendering
        run: python3 scripts/tests/test_proxmox_csi_bootstrap.py

      - name: Test verified worker Node retirement
        run: python3 scripts/tests/test_node_retirement.py

      - name: Test activation preflight inventory drift
        run: python3 scripts/tests/test_csi_preflight.py

      - name: Test post-install drain recovery
        run: python3 scripts/tests/test_drain_recovery.py

      - name: Test manual Proxmox CSI setup refusals
        run: python3 scripts/tests/test_proxmox_csi_storage.py

      - name: Test deploy workflow ownership
        run: python3 scripts/tests/test_deploy_lock.py

      - name: Test workflow credential handling
        run: python3 scripts/tests/test_workflow_credentials.py

      - name: Run ansible-lint
        run: |
          set +e
          # No path argument. Passing `.` makes ansible-lint treat the repo root
          # as a single lintable: it only picks up root-level files and never
          # descends into roles/, so a role with a blatant violation still
          # reports "Passed". Argless invocation uses git-based project
          # discovery and lints everything. Do not re-add the `.`.
          OUTPUT=$(ansible-lint --offline --force-color 2>&1)
          EXIT_CODE=$?
          set -e

          echo "### 🔍 Ansible Lint Results" >> $GITHUB_STEP_SUMMARY
          
          if [ $EXIT_CODE -eq 0 ]; then
             echo "✅ **Passed**" >> $GITHUB_STEP_SUMMARY
          else
             echo "❌ **Failed**" >> $GITHUB_STEP_SUMMARY
             echo '```term' >> $GITHUB_STEP_SUMMARY
             echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
             echo '```' >> $GITHUB_STEP_SUMMARY
             exit 1
          fi

  syntax-check:
    name: Ansible Syntax Check
    runs-on: self-hosted
    container:
      # Match deploy.yml; Ansible 2.21 fails to import under Python 3.15.
      image: python:3.15-trixie
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Ansible and requirements
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml --force

      # --syntax-check never connects to hosts or decrypts the vault, so this
      # pull_request job gets no SSH key or vault password (as in the lint job).
      - name: Create dummy Ansible Vault password file
        run: echo "dummy" > .vault_pass

      - name: Run Ansible Syntax Check
        env:
          PROXMOX_URL: ${{ secrets.PROXMOX_URL }}
          PROXMOX_USER: ${{ secrets.PROXMOX_USER }}
          PROXMOX_TOKEN_ID: ${{ secrets.PROXMOX_TOKEN_ID }}
          PROXMOX_TOKEN_SECRET: ${{ secrets.PROXMOX_TOKEN_SECRET }}
        run: |
          echo "### 🛠️ Syntax Check Results" >> $GITHUB_STEP_SUMMARY

          set +e
          OUTPUT=$(ansible-playbook -i inventory/proxmox.yml \
            --vault-password-file .vault_pass \
            --syntax-check k3s.yml ser2net.yml i915-sriov.yml i915-acceptance.yml proxmox-csi-storage.yml csi-activation-preflight.yml 2>&1)
          EXIT_CODE=$?
          set -e

          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ **Valid**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Invalid**" >> $GITHUB_STEP_SUMMARY
            echo '```term' >> $GITHUB_STEP_SUMMARY
            echo "$OUTPUT" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Remove dummy Ansible Vault password file
        if: always()
        run: rm -f .vault_pass
